<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽奖卡片</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui, sans-serif;
}
body{
    min-height:100vh;
    transition: background 0.4s, color 0.4s;
    padding:20px;
}
body.dark{
    background:#12141d;
    color:#eee;
}
body.light{
    background:#f8f9fa;
    color:#222;
}
.container{
    max-width:1200px;
    margin:0 auto;
    text-align:center;
}
.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}
button{
    padding:10px 22px;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:0.2s;
}
#startBtn{
    background:#3671e9;
    color:white;
}
#startBtn:disabled{
    background:#88a8ee;
    cursor:not-allowed;
}
#themeBtn{
    background:#444;
    color:white;
}
body.light #themeBtn{
    background:#ddd;
    color:#111;
}
.card-wrap{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:18px;
    justify-items:center;
}
.card{
    width:297px;
    height:427px;
    border-radius:14px;
    overflow:hidden;
    border:3px solid #777;
    transition: all 0.25s;
    position:relative;
}
/* 不间断摇摆动画 */
@keyframes swing {
    0% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
    100% { transform: rotate(-3deg); }
}
.card.swing{
    animation: swing 0.28s ease-in-out infinite;
}
.card.selected{
    animation: selectPop 0.6s ease-out;
    border-color:#ffd700;
    box-shadow:0 0 24px #ffd700;
}
@keyframes selectPop{
    0%{transform:scale(1)}
    50%{transform:scale(1.06)}
    100%{transform:scale(1)}
}
.card img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.card-desc{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    padding:12px;
    background:rgba(0,0,0,0.65);
    color:white;
    font-size:15px;
}
/* 屏幕抖动特效 */
@keyframes shakeScreen{
    0%,100% { transform: translate(0,0); }
    10% { transform: translate(-6px,6px); }
    20% { transform: translate(6px,-6px); }
    30% { transform: translate(-6px,-6px); }
    40% { transform: translate(6px,6px); }
    50% { transform: translate(-4px,4px); }
    60% { transform: translate(4px,-4px); }
    70% { transform: translate(-4px,-4px); }
    80% { transform: translate(4px,4px); }
    90% { transform: translate(-2px,2px); }
}
.shake-all{
    animation: shakeScreen 0.7s ease-out;
}
/* 金色粒子 */
.particle{
    position:fixed;
    pointer-events:none;
    width:12px;
    height:12px;
    background:#ffd700;
    border-radius:50%;
    z-index:999;
}
.visit-count{
    margin-top:24px;
    font-size:15px;
    transition:color 0.3s;
}
body.dark .visit-count{
    color:#dddddd;
}
body.light .visit-count{
    color:#333333;
}
/* 响应式适配小屏幕 */
@media (max-width:980px){
    .card-wrap{
        grid-template-columns: repeat(2,1fr);
    }
    .card{
        width:min(297px, 90vw);
        height:min(427px, calc(90vw * 427 / 297));
    }
}
@media (max-width:620px){
    .card-wrap{
        grid-template-columns: repeat(1,1fr);
    }
}
</style>
</head>
<body class="light">
<div class="container">
    <div class="top-bar">
        <button id="startBtn">开始抽奖</button>
        <button id="themeBtn">切换黑夜/白天</button>
    </div>
    <div class="card-wrap" id="cardWrap">
        <!-- 卡片1 -->
        <div class="card" data-weight="100" data-particle="false">
            <img src="game_1.png">
            <div class="card-desc">对不起哈TAT<br>(不过下次运气好点就行啦)</div>
        </div>
        <!-- 卡片2 -->
        <div class="card" data-weight="100" data-particle="false">
            <img src="game_2.png">
            <div class="card-desc">可以去吃零食！<br>（没有就出发去买awa）</div>
        </div>
        <!-- 卡片3 -->
        <div class="card" data-weight="100" data-particle="false">
            <img src="game_2.png">
            <div class="card-desc">可以去吃零食！<br>（没有就出发去买awa）</div>
        </div>
        <!-- 卡片4 -->
        <div class="card" data-weight="95" data-particle="false">
            <img src="game_3.png">
            <div class="card-desc">快快快买吃的去！！！</div>
        </div>
        <!-- 卡片5 -->
        <div class="card" data-weight="85" data-particle="false">
            <img src="game_1.png">
            <div class="card-desc">奖品5</div>
        </div>
        <!-- 卡片6 -->
        <div class="card" data-weight="85" data-particle="false">
            <img src="game_1.png">
            <div class="card-desc">奖品6</div>
        </div>
        <!-- 卡片7 -->
        <div class="card" data-weight="75" data-particle="true">
            <img src="game_5.png">
            <div class="card-desc">共三局，规则如下：<br>1. 赢一局=吃零食<br>2. 赢两局=看电视30min<br>3. 赢三局=50元代金券<br>4. 高级不选也可以选低级</div>
        </div>
        <!-- 卡片8 -->
        <div class="card" data-weight="75" data-particle="true">
            <img src="game_5.png">
            <div class="card-desc">共三局，规则如下：<br>1. 赢一局=吃零食<br>2. 赢两局=看电视30min<br>3. 赢三局=50元代金券<br>4. 高级不选也可以选低级</div>
        </div>
        <!-- 卡片9 -->
        <div class="card" data-weight="100" data-particle="false">
            <img src="game_1.png">
            <div class="card-desc">对不起哈TAT<br>(不过下次运气好点就行啦)</div>
        </div>
    </div>
    <!-- 访问统计区域 -->
    <div class="visit-count">
        <span>页面总访问：</span>
        <span id="busuanzi_value_page_pv">0</span>
        <span>次</span>
    </div>
</div>

<script>
//昼夜切换
const body = document.body;
const themeBtn = document.getElementById('themeBtn');
themeBtn.onclick = ()=>{
    body.classList.toggle('dark');
    body.classList.toggle('light');
}

const startBtn = document.getElementById('startBtn');
const cards = document.querySelectorAll('.card');
let isRolling = false;
let rollTimer;

//权重随机算法
function getRandomCard(){
    let totalWeight = 0;
    let list = [];
    cards.forEach(card=>{
        const w = Number(card.dataset.weight);
        totalWeight += w;
        list.push({el:card, weight:w});
    })
    let r = Math.random() * totalWeight;
    for(let item of list){
        r -= item.weight;
        if(r <= 0) return item.el;
    }
    return list[0].el;
}

//粒子特效
function createGoldParticle(){
    for(let i=0;i<35;i++){
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random()*100 + 'vw';
        p.style.top = Math.random()*100 + 'vh';
        document.body.appendChild(p);
        const dx = (Math.random()-0.5)*220;
        const dy = (Math.random()-0.5)*220;
        p.animate([
            {transform:'translate(0,0)', opacity:1},
            {transform:`translate(${dx}px,${dy}px)`, opacity:0}
        ],{duration:900});
        setTimeout(()=>p.remove(),900);
    }
}

startBtn.onclick = async ()=>{
    if(isRolling) return;
    isRolling = true;
    startBtn.disabled = true;
    //重置
    cards.forEach(c=>c.classList.remove('selected','swing'));
    let idx = 0;
    //持续遍历卡片
    rollTimer = setInterval(()=>{
        cards.forEach(c=>c.classList.remove('swing'));
        cards[idx].classList.add('swing');
        idx = (idx+1) % cards.length;
    },75);

    //抽奖结束
    await new Promise(res=>setTimeout(res, 2200));
    clearInterval(rollTimer);
    const targetCard = getRandomCard();
    cards.forEach(c=>c.classList.remove('swing'));
    targetCard.classList.add('selected');

    //高级奖品抖动+粒子
    if(targetCard.dataset.particle === "true"){
        document.body.classList.add('shake-all');
        createGoldParticle();
        setTimeout(()=>document.body.classList.remove('shake-all'),700);
    }
    isRolling = false;
    startBtn.disabled = false;
}
</script>

<!-- 不蒜子统计JS -->
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
